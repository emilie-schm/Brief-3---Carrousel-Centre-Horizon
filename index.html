<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrousel</title>
</head>
<body>
    <header>
        <h1>Explorez notre galerie d'inspiration</h1>
    <div class ="toolbar">
    <a href="#" id="toolbar-toggle">Afficher/cacher</a>
        </div>
    </header>
    <main>

        <div class="buttons">
           <button id="slider-previous">Précédent</button>
           <button id="slider-toggle">Pause/lecture</button>
           <button id="slider-next">Suivant</button>
           <button id="slider-random">Random</button>
        </div>

        <figure class="slider">
            <img src="images/loup1.jpg" alt="Image loup blanc">
            <figcaption id="slider-caption">Photo de loup blanc</figcaption>
        </figure>

        <p id="slider-counter">1/6</p>



    </main>

    
</body>
</html>
