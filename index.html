<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorez notre galerie d'inspiration</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Explorez notre galerie d'inspiration</h1>
    </header>

    <div class="toolbar-container">
        <button class="toolbar" id="toolbar-toggle" aria-expanded="false">Afficher/Cacher</button>
    </div>

    <main>
        <div class="toolbar hidden" id="toolbar-buttons">
            <button id="slider-previous" aria-label="Photo précédente"><i class="fa-solid fa-backward"></i></button>
            <button id="slider-toggle" aria-label="Lecture"><i class="fa-solid fa-play"></i></button>
            <button id="slider-next" aria-label="Photo suivante"><i class="fa-solid fa-forward"></i></button>
            <button id="slider-random" aria-label="Photo aléatoire"><i class="fa-solid fa-shuffle"></i></button>
        </div>

        <figure class="slider" id="slider">
            <img id="slider-image" src="images/loup1.jpg" alt="Loup blanc couché dans une forêt, à moitié caché derrière des branches de sapin">
            <figcaption id="slider-caption">Loup blanc au repos</figcaption>
        </figure>

        <p id="slider-counter">1 / 6</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
